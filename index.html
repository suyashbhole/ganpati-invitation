<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#210800">

    <title>गणपती बाप्पा मोरया</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Noto Sans Devanagari", sans-serif;
            background: #210800;
            color: white;
            overflow: hidden;
            position: relative;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(35, 5, 0, 0.58),
                    rgba(35, 5, 0, 0.78)
                ),
                url("ganpati-bg.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: -3;

            /* Desktop only */
            animation: backgroundZoom 18s ease-in-out infinite alternate;

            will-change: transform;
        }

        @keyframes backgroundZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }


        /* =========================
           OVERLAY
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 10%,
                    rgba(0,0,0,.25) 55%,
                    rgba(0,0,0,.72) 100%
                );

            z-index: -2;
        }


        /* =========================
           PARTICLES
        ========================= */

        .particles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 1;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ffd76a;

            box-shadow:
                0 0 5px #ffd76a;

            animation:
                particleMove
                linear
                infinite;
        }

        @keyframes particleMove {

            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .main-screen {
            width: 100%;
            height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 15px;

            position: relative;

            z-index: 2;
        }

        .main-content {
            width: min(520px, 94vw);

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           OM
        ========================= */

        .om {
            font-size: 42px;

            color: #ffd76a;

            text-shadow:
                0 0 8px #ffb300;

            margin-bottom: 5px;

            animation:
                omGlow 2s
                infinite alternate;
        }

        @keyframes omGlow {

            from {
                text-shadow:
                    0 0 8px #ffb300;
            }

            to {
                text-shadow:
                    0 0 14px #ffb300;
            }
        }


        /* =========================
           MAIN TITLE
        ========================= */

        .main-title {
            font-family:
                "Great Vibes",
                cursive;

            font-size:
                clamp(50px, 9vw, 85px);

            color: #ffd66b;

            line-height: 1;

            text-shadow:
                0 3px 5px #000,
                0 0 15px rgba(255,170,0,.5);

            margin-bottom: 5px;
        }


        .sub-title {
            font-family: Cinzel, serif;

            font-size:
                clamp(13px, 2vw, 17px);

            letter-spacing: 3px;

            color: #ffe9ad;

            margin-bottom: 20px;
        }


        /* =========================
           MENU
        ========================= */

        .menu {
            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .menu-btn {
            width: 100%;

            min-height: 58px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,210,100,.5);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,184,50,.95),
                    rgba(214,82,0,.95)
                );

            color: #421600;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 6px 18px rgba(0,0,0,.35);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
        }

        .menu-btn:active {
            transform: scale(.97);
        }

        .menu-btn span {
            display: block;

            font-size: 11px;

            font-family: Cinzel, serif;

            letter-spacing: 1px;

            opacity: .75;

            margin-top: 2px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 18px;

            color: #ead4a0;

            font-size: 18px;

            line-height: 1.5;

            letter-spacing: .5px;
        }


        /* =========================
           GANPATI POPUP
        ========================= */

        .popup {
            position: fixed;

            inset: 0;

            background:
                rgba(15,2,0,.90);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px;

            opacity: 0;

            visibility: hidden;

            transform: scale(1.04);

            transition:
                opacity .25s ease,
                transform .25s ease;

            z-index: 50;
        }

        .popup.active {
            opacity: 1;

            visibility: visible;

            transform: scale(1);
        }

        .popup-card {
            width: min(550px, 94vw);

            max-height: 94dvh;

            overflow-y: auto;

            padding: 25px 20px;

            text-align: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(75,12,0,.98),
                    rgba(25,3,0,.98)
                );

            border:
                1px solid
                rgba(255,210,100,.55);

            box-shadow:
                0 0 35px
                rgba(255,160,20,.25);
        }


        /* =========================
           GANPATI IMAGE
        ========================= */

        .popup-ganpati {
            width: min(220px, 45vw);

            max-height: 260px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(255,190,60,.6)
                );

            animation:
                ganpatiFloat
                4s
                ease-in-out
                infinite;
        }

        @keyframes ganpatiFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        .popup-title {
            font-family:
                "Great Vibes",
                cursive;

            color: #ffd66b;

            font-size:
                clamp(38px, 7vw, 58px);

            margin: 5px 0;
        }

        .popup-subtitle {
            color: #ffe6a0;

            font-family: Cinzel, serif;

            font-size: 14px;

            margin-bottom: 18px;
        }


        /* =========================
           EVENT BUTTONS
        ========================= */

        .event-buttons {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 15px;
        }

        .event-btn {
            min-height: 70px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,205,90,.35);

            background:
                rgba(255,180,40,.12);

            color: #ffd66b;

            cursor: pointer;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size: 14px;

            font-weight: 600;

            transition:
                transform .2s ease,
                background .2s ease;
        }

        .event-btn:hover {
            background:
                rgba(255,180,40,.25);

            transform:
                translateY(-2px);
        }

        .event-btn small {
            display: block;

            font-family: Cinzel, serif;

            font-size: 10px;

            margin-top: 3px;

            color: #e7d2a0;
        }


        /* =========================
           MEDIA POPUP
        ========================= */

        .media-popup {
            position: fixed;

            inset: 0;

            background:
                rgba(10,1,0,.94);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 10px;

            opacity: 0;

            visibility: hidden;

            z-index: 100;

            transition:
                opacity .25s ease;
        }

        .media-popup.active {
            opacity: 1;

            visibility: visible;
        }

        .media-card {
            width: min(850px, 96vw);

            max-height: 94dvh;

            overflow-y: auto;

            background:
                linear-gradient(
                    145deg,
                    #4b0b00,
                    #180300
                );

            border-radius: 22px;

            padding: 15px;

            border:
                1px solid
                rgba(255,210,100,.5);

            text-align: center;
        }

        .media-title {
            color: #ffd66b;

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                clamp(30px, 7vw, 45px);

            line-height: 1.2;

            margin-bottom: 12px;
        }


        /* =========================
           IMAGE
        ========================= */

        .event-image {
            display: block;

            width: 100%;

            max-height: 330px;

            object-fit: contain;

            border-radius: 15px;

            margin: 0 auto 12px;

            background: #000;
        }


        /* =========================
           VIDEO
        ========================= */

        .event-video {
            display: block;

            width: 100%;

            max-width: 800px;

            height: auto;

            max-height: 350px;

            margin: 0 auto;

            border-radius: 15px;

            background: #000;

            object-fit: contain;
        }


        /* =========================
           SOUND BUTTON
        ========================= */

        .sound-btn {
            display: none;

            margin-top: 10px;

            padding: 10px 18px;

            border: 1px solid #d9a82f;

            border-radius: 50px;

            background:
                rgba(255,180,40,.15);

            color: #ffd66b;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size: 14px;

            cursor: pointer;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-btn {
            margin-top: 15px;

            padding:
                10px 25px;

            border-radius: 50px;

            border:
                1px solid #d9a82f;

            background:
                transparent;

            color: #ffd66b;

            cursor: pointer;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            /* Disable expensive animation */
            .background {
                animation: none;

                will-change: auto;
            }

            /* Reduce particle count visually */
            .particle {
                box-shadow: none;

                width: 2px;
                height: 2px;
            }

            .main-screen {
                height: 100dvh;

                padding:
                    10px;
            }

            .main-content {
                width: 94vw;
            }

            .om {
                font-size: 34px;

                animation: none;
            }

            .main-title {
                font-size: 52px;

                text-shadow:
                    0 2px 4px #000;
            }

            .sub-title {
                font-size: 10px;

                letter-spacing: 1.5px;

                margin-bottom: 14px;
            }

            .menu {
                gap: 8px;
            }

            .menu-btn {
                min-height: 52px;

                height: 52px;

                border-radius: 14px;

                font-size: 15px;

                box-shadow:
                    0 4px 12px
                    rgba(0,0,0,.3);
            }

            .menu-btn span {
                font-size: 9px;
            }

            .footer {
                font-size: 14px;

                margin-top: 12px;
            }


            /* POPUP */

            .popup {
                padding: 8px;
            }

            .popup-card {
                width: 96vw;

                max-height: 92dvh;

                padding:
                    16px 12px;

                border-radius: 20px;

                box-shadow:
                    0 0 25px
                    rgba(255,160,20,.2);
            }

            .popup-ganpati {
                width: 145px;

                max-height: 170px;

                animation: none;
            }

            .popup-title {
                font-size: 40px;
            }

            .popup-subtitle {
                font-size: 12px;

                margin-bottom: 10px;
            }

            .event-buttons {
                grid-template-columns: 1fr;

                gap: 8px;

                margin-top: 8px;
            }

            .event-btn {
                min-height: 52px;

                font-size: 13px;
            }


            /* MEDIA */

            .media-popup {
                padding: 6px;
            }

            .media-card {
                width: 98vw;

                max-height: 94dvh;

                padding: 10px;

                border-radius: 18px;
            }

            .media-title {
                font-size: 32px;

                margin-bottom: 8px;
            }

            .event-image {
                max-height: 220px;

                border-radius: 10px;
            }

            .event-video {
                max-height: 260px;

                border-radius: 10px;
            }

            .sound-btn {
                display: inline-block;
            }

            .close-btn {
                margin-top: 10px;

                padding:
                    8px 20px;
            }
        }


        /* =========================
           SMALL HEIGHT PHONE
        ========================= */

        @media (max-height: 650px) and (max-width: 600px) {

            .main-title {
                font-size: 45px;
            }

            .om {
                font-size: 28px;
            }

            .sub-title {
                margin-bottom: 8px;
            }

            .menu {
                gap: 6px;
            }

            .menu-btn {
                height: 44px;

                min-height: 44px;

                font-size: 13px;
            }

            .footer {
                display: none;
            }
        }


        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background"></div>

    <div class="overlay"></div>


    <!-- PARTICLES -->

    <div
        class="particles"
        id="particles">
    </div>


    <!-- MAIN -->

    <main class="main-screen">

        <div class="main-content">

            <div class="invitation-title">
                ॥ सस्नेह निमंत्रण ॥ 🌺
            </div>


            <div class="om">
                ॐ
            </div>


            <h1 class="main-title">
                गणपती बाप्पा मोरया
            </h1>


            <div class="sub-title">
                ॥ श्री गणेशाय नमः ॥
            </div>


            <div class="menu">


                <button
                    class="menu-btn"
                    onclick="openGanpatiPopup()">

                    🙏 आराधनाचा राजा

                    <span>
                        ARADHANACHA RAJA
                    </span>

                </button>


                <button
                    class="menu-btn"
                    onclick="openMedia('aagman')">

                    🪔 आगमन सोहळा

                    <span>
                        AAGMAN SOHALA
                    </span>

                </button>


                <button
                    class="menu-btn"
                    onclick="openMedia('visarjan')">

                    🌺 विसर्जन सोहळा

                    <span>
                        VISARJAN SOHALA
                    </span>

                </button>


            </div>


            <div class="footer">

                ॥ श्री आराधना गणेश मंडळ ॥

                <br>

                चौधरीवाडा, न्हावी

            </div>


        </div>

    </main>


    <!-- GANPATI POPUP -->

    <div
        class="popup"
        id="ganpatiPopup">

        <div class="popup-card">


            <div class="sub-title">
                ॥ श्री गणेशाय नमः ॥
            </div>


            <img
                src="ganpati-bg.jpg"
                class="popup-ganpati"
                alt="Ganpati Bappa"
                loading="lazy">


            <div class="popup-title">
                आराधनाचा राजा
            </div>


            <div class="popup-subtitle">
                गणपती बाप्पा मोरया 🙏
            </div>


            <div class="event-buttons">


                <button
                    class="event-btn"
                    onclick="openMedia('aagman')">

                    🪔 आगमन सोहळा

                    <small>
                        IMAGE + VIDEO
                    </small>

                </button>


                <button
                    class="event-btn"
                    onclick="openMedia('visarjan')">

                    🌺 विसर्जन सोहळा

                    <small>
                        IMAGE + VIDEO
                    </small>

                </button>


            </div>


            <button
                class="close-btn"
                onclick="closeGanpatiPopup()">

                ← मागे जा

            </button>


        </div>

    </div>


    <!-- MEDIA POPUP -->

    <div
        class="media-popup"
        id="mediaPopup">

        <div class="media-card">


            <div
                class="media-title"
                id="mediaTitle">
            </div>


            <img
                id="eventImage"
                class="event-image"
                src=""
                alt="Event Image"
                loading="lazy">


            <video
                id="eventVideo"
                class="event-video"
                controls
                playsinline
                preload="metadata">

                <source
                    id="videoSource"
                    src=""
                    type="video/mp4">

                तुमच्या ब्राउझरमध्ये व्हिडिओ सपोर्ट नाही.

            </video>


            <!-- MOBILE SOUND BUTTON -->

            <button
                id="soundButton"
                class="sound-btn"
                onclick="enableSound()">

                🔊 आवाज सुरू करा

            </button>


            <button
                class="close-btn"
                onclick="closeMedia()">

                ← मागे जा

            </button>


        </div>

    </div>


    <script>

        /* =========================
           PARTICLES
        ========================= */

        const particles =
            document.getElementById("particles");

        const isMobile =
            window.matchMedia(
                "(max-width: 600px)"
            ).matches;

        const particleCount =
            isMobile ? 12 : 22;


        for (
            let i = 0;
            i < particleCount;
            i++
        ) {

            const p =
                document.createElement("div");

            p.className =
                "particle";

            p.style.left =
                Math.random() * 100 + "%";

            p.style.animationDuration =
                (6 + Math.random() * 7) + "s";

            p.style.animationDelay =
                Math.random() * 7 + "s";

            particles.appendChild(p);
        }


        /* =========================
           ELEMENTS
        ========================= */

        const ganpatiPopup =
            document.getElementById(
                "ganpatiPopup"
            );

        const mediaPopup =
            document.getElementById(
                "mediaPopup"
            );

        const mediaTitle =
            document.getElementById(
                "mediaTitle"
            );

        const eventImage =
            document.getElementById(
                "eventImage"
            );

        const eventVideo =
            document.getElementById(
                "eventVideo"
            );

        const videoSource =
            document.getElementById(
                "videoSource"
            );

        const soundButton =
            document.getElementById(
                "soundButton"
            );


        /* =========================
           GANPATI POPUP
        ========================= */

        function openGanpatiPopup() {

            ganpatiPopup
                .classList
                .add("active");
        }


        function closeGanpatiPopup() {

            ganpatiPopup
                .classList
                .remove("active");
        }


        /* =========================
           OPEN MEDIA
        ========================= */

        function openMedia(type) {

            closeGanpatiPopup();


            /* Stop previous video */

            eventVideo.pause();

            eventVideo.currentTime = 0;


            if (type === "aagman") {

                mediaTitle.innerHTML =
                    "आगमन सोहळा - १२-०९-२०२६ 🥁<br>" +
                    "<small>शिवराज्य बँड, चांदवड</small>";


                eventImage.src =
                    "aagman.jpg";


                videoSource.src =
                    "aagman.mp4";

            }


            if (type === "visarjan") {

                mediaTitle.innerHTML =
                    "विसर्जन सोहळा - २०-०९-२०२६ 🎵<br>" +
                    "<small>रॉकस्टार बँड ७८, चांदवड</small>";


                eventImage.src =
                    "visarjan.jpg";


                videoSource.src =
                    "visarjan.mp4";
            }


            /*
             IMPORTANT:
             Load only after user clicks.
            */

            eventVideo.load();


            /*
             Show sound button on mobile.
            */

            if (isMobile) {

                soundButton.style.display =
                    "inline-block";

            }


            mediaPopup
                .classList
                .add("active");
        }


        /* =========================
           ENABLE SOUND
        ========================= */

        function enableSound() {

            eventVideo.muted = false;

            eventVideo.volume = 1;

            eventVideo.play()
                .then(() => {

                    soundButton.innerHTML =
                        "🔊 आवाज सुरू आहे";

                    soundButton.style.display =
                        "none";

                })
                .catch(() => {

                    soundButton.innerHTML =
                        "▶️ व्हिडिओवर Play दाबा";

                });
        }


        /* =========================
           CLOSE MEDIA
        ========================= */

        function closeMedia() {

            eventVideo.pause();

            eventVideo.currentTime = 0;

            mediaPopup
                .classList
                .remove("active");
        }


        /* =========================
           ESC KEY
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeMedia();

                    closeGanpatiPopup();

                }

            }
        );


        /* =========================
           CLICK BACKDROP TO CLOSE
        ========================= */

        mediaPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === mediaPopup
                ) {

                    closeMedia();

                }

            }
        );


        ganpatiPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === ganpatiPopup
                ) {

                    closeGanpatiPopup();

                }

            }
        );

    </script>

</body>

</html>
