<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>आराधनाचा राजा | श्री आराधना गणेश मंडळ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            background: #210800;

            color: white;

            position: relative;

            overflow-x: hidden;

            overflow-y: auto;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            background:
                linear-gradient(
                    rgba(35, 5, 0, 0.55),
                    rgba(35, 5, 0, 0.75)
                ),
                url("ganpati-bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            z-index: -3;

            animation:
                backgroundZoom
                15s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes backgroundZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    transparent 10%,
                    rgba(0, 0, 0, 0.25) 55%,
                    rgba(0, 0, 0, 0.75) 100%
                );

            z-index: -2;

            pointer-events: none;
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {
            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 1;
        }


        .particle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #ffd76a;

            box-shadow:
                0 0 8px #ffd76a,
                0 0 15px #ff9800;

            animation:
                particleMove
                linear
                infinite;
        }


        @keyframes particleMove {

            from {
                transform:
                    translateY(100vh);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {
                transform:
                    translateY(-10vh);

                opacity: 0;
            }
        }


        /* =====================================================
           MAIN SCREEN
        ===================================================== */

        .main-screen {

            width: 100%;

            min-height: 100vh;

            min-height: 100dvh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px 15px;

            position: relative;

            z-index: 2;
        }


        .main-content {

            width: min(520px, 94vw);

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           OM
        ===================================================== */

        .om {

            font-size: 55px;

            color: #ffd76a;

            line-height: 1;

            margin-bottom: 25px;

            text-shadow:

                0 0 10px #ffb300,

                0 0 25px #ff8c00;

            animation:
                omGlow
                2s
                infinite
                alternate;
        }


        @keyframes omGlow {

            from {

                text-shadow:
                    0 0 8px #ffb300;
            }

            to {

                text-shadow:
                    0 0 15px #ffb300,
                    0 0 30px #ff8c00;
            }
        }


        /* =====================================================
           MAIN TITLE
        ===================================================== */

        .main-title {

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                clamp(50px, 9vw, 85px);

            color: #ffd66b;

            line-height: 1;

            text-shadow:

                0 3px 5px #000,

                0 0 20px
                rgba(255, 170, 0, 0.6);

            margin-bottom: 12px;
        }


        /* =====================================================
           SUB TITLE
        ===================================================== */

        .sub-title {

            font-family:
                Cinzel,
                serif;

            font-size:
                clamp(13px, 2vw, 17px);

            letter-spacing: 3px;

            color: #ffe9ad;

            margin-bottom: 20px;
        }


        /* =====================================================
           MENU
        ===================================================== */

        .menu {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .menu-btn {

            width: 100%;

            min-height: 58px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255, 210, 100, 0.5);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 184, 50, 0.95),
                    rgba(214, 82, 0, 0.95)
                );

            color: #421600;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:

                0 8px 25px
                rgba(0, 0, 0, 0.35),

                0 0 20px
                rgba(255, 160, 30, 0.2);

            transition:
                0.3s;

            padding: 8px 15px;
        }


        .menu-btn:hover {

            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:

                0 12px 30px
                rgba(0, 0, 0, 0.45),

                0 0 30px
                rgba(255, 180, 40, 0.4);
        }


        .menu-btn:active {

            transform:
                scale(0.97);
        }


        .menu-btn span {

            display: block;

            font-size: 12px;

            font-family:
                Cinzel,
                serif;

            letter-spacing: 1px;

            opacity: 0.75;

            margin-top: 2px;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 22px;

            color: #ffd66b;

            font-size: 22px;

            line-height: 1.5;

            font-weight: 700;

            text-shadow:
                0 2px 5px #000;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           FIRST POPUP
        ===================================================== */

        .popup {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(15, 2, 0, 0.88);

            backdrop-filter:
                blur(10px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px;

            opacity: 0;

            visibility: hidden;

            transform:
                scale(1.08);

            transition:
                0.4s;

            z-index: 50;
        }


        .popup.active {

            opacity: 1;

            visibility: visible;

            transform:
                scale(1);
        }


        .popup-card {

            width:
                min(550px, 94vw);

            max-height: 94vh;

            max-height: 94dvh;

            overflow-y: auto;

            padding:
                25px 20px;

            text-align: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(75, 12, 0, 0.97),
                    rgba(25, 3, 0, 0.97)
                );

            border:
                1px solid
                rgba(255, 210, 100, 0.55);

            box-shadow:

                0 0 60px
                rgba(255, 160, 20, 0.25);
        }


        /* =====================================================
           GANPATI IMAGE
        ===================================================== */

        .popup-ganpati {

            width:
                min(220px, 45vw);

            max-height: 260px;

            object-fit: contain;

            border-radius: 15px;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255, 190, 60, 0.7)
                );

            animation:
                ganpatiFloat
                4s
                ease-in-out
                infinite;
        }


        @keyframes ganpatiFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-10px);
            }
        }


        /* =====================================================
           POPUP TITLE
        ===================================================== */

        .popup-title {

            font-family:
                "Great Vibes",
                cursive;

            color: #ffd66b;

            font-size:
                clamp(38px, 7vw, 58px);

            margin: 10px 0 5px;
        }


        .popup-subtitle {

            color: #ffe6a0;

            font-family:
                Cinzel,
                serif;

            font-size: 14px;

            margin-bottom: 18px;
        }


        /* =====================================================
           EVENT BUTTONS
        ===================================================== */

        .event-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 15px;
        }


        .event-btn {

            min-height: 70px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255, 205, 90, 0.35);

            background:
                rgba(255, 180, 40, 0.12);

            color: #ffd66b;

            cursor: pointer;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size: 14px;

            font-weight: 600;

            transition:
                0.3s;

            padding: 8px;
        }


        .event-btn:hover {

            background:
                rgba(255, 180, 40, 0.25);

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px
                rgba(255, 160, 20, 0.2);
        }


        .event-btn small {

            display: block;

            font-family:
                Cinzel,
                serif;

            font-size: 10px;

            margin-top: 3px;

            color: #e7d2a0;
        }


        /* =====================================================
           MEDIA POPUP
        ===================================================== */

        .media-popup {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(10, 1, 0, 0.92);

            backdrop-filter:
                blur(10px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px;

            opacity: 0;

            visibility: hidden;

            z-index: 100;

            transition:
                0.3s;
        }


        .media-popup.active {

            opacity: 1;

            visibility: visible;
        }


        .media-card {

            width:
                min(850px, 96vw);

            max-height: 94vh;

            max-height: 94dvh;

            overflow-y: auto;

            background:
                linear-gradient(
                    145deg,
                    #4b0b00,
                    #180300
                );

            border-radius: 25px;

            padding: 20px;

            border:
                1px solid
                rgba(255, 210, 100, 0.5);

            text-align: center;
        }


        .media-title {

            color: #ffd66b;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            font-size:
                clamp(22px, 5vw, 35px);

            line-height: 1.4;

            margin-bottom: 15px;
        }


        /* =====================================================
           EVENT IMAGE
        ===================================================== */

        .event-image {

            width: 100%;

            max-height: 330px;

            object-fit: contain;

            border-radius: 15px;

            margin-bottom: 15px;

            background: #000;

            display: block;
        }


        /* =====================================================
           EVENT VIDEO
        ===================================================== */

        .event-video {

            width: 100%;

            max-height: 350px;

            border-radius: 15px;

            background: #000;

            display: block;

            object-fit: contain;
        }


        /* =====================================================
           VIDEO ERROR MESSAGE
        ===================================================== */

        .video-error {

            display: none;

            margin-top: 10px;

            padding: 10px;

            border-radius: 10px;

            background:
                rgba(255, 80, 30, 0.15);

            color: #ffd6a0;

            font-size: 12px;
        }


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        .close-btn {

            margin-top: 15px;

            padding:
                10px 25px;

            border-radius: 50px;

            border:
                1px solid #d9a82f;

            background:
                transparent;

            color: #ffd66b;

            cursor: pointer;

            font-family:
                "Noto Sans Devanagari",
                sans-serif;

            transition:
                0.3s;
        }


        .close-btn:hover {

            background: #ffd66b;

            color: #401500;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .main-screen {

                padding:
                    20px 12px;
            }


            .main-content {

                width: 94vw;
            }


            .om {

                font-size: 45px;

                margin-bottom: 20px;
            }


            .main-title {

                font-size: 52px;

                margin-bottom: 10px;
            }


            .sub-title {

                font-size: 11px;

                letter-spacing: 1.5px;

                margin-bottom: 15px;
            }


            .menu {

                gap: 9px;
            }


            .menu-btn {

                min-height: 52px;

                border-radius: 15px;

                font-size: 15px;
            }


            .menu-btn span {

                font-size: 9px;
            }


            .footer {

                font-size: 17px;

                margin-top: 15px;
            }


            .popup-card {

                padding:
                    18px 15px;

                border-radius: 22px;
            }


            .popup-ganpati {

                width: 160px;

                max-height: 190px;
            }


            .popup-title {

                font-size: 42px;
            }


            .event-buttons {

                grid-template-columns:
                    1fr;
            }


            .event-btn {

                min-height: 55px;
            }


            .media-card {

                padding: 15px;

                border-radius: 20px;
            }


            .media-title {

                font-size: 22px;

                margin-bottom: 12px;
            }


            .event-image {

                max-height: 230px;
            }


            .event-video {

                max-height: 240px;
            }
        }


        /* =====================================================
           SHORT SCREEN
        ===================================================== */

        @media (max-height: 650px) {

            .main-screen {

                align-items: flex-start;

                padding-top: 20px;
            }


            .om {

                font-size: 35px;

                margin-bottom: 12px;
            }


            .main-title {

                font-size: 48px;
            }


            .sub-title {

                margin-bottom: 10px;
            }


            .menu {

                gap: 7px;
            }


            .menu-btn {

                min-height: 45px;

                font-size: 14px;
            }


            .footer {

                font-size: 14px;

                margin-top: 10px;
            }


            .popup-ganpati {

                width: 130px;

                max-height: 150px;
            }


            .popup-card {

                padding: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background"></div>

    <div class="overlay"></div>


    <!-- =====================================================
         PARTICLES
    ====================================================== -->

    <div class="particles" id="particles"></div>


    <!-- =====================================================
         MAIN SCREEN
    ====================================================== -->

    <main class="main-screen">

        <div class="main-content">

            <div class="om">
                ॐ
            </div>


            <h1 class="main-title">
                गणपती बाप्पा मोरया
            </h1>


            <div class="sub-title">
                ॥ श्री गणेशाय नमः ॥
            </div>


            <div class="menu">

                <!-- BUTTON 1 -->

                <button
                    class="menu-btn"
                    onclick="openGanpatiPopup()">

                    🙏 आराधनाचा राजा

                    <span>
                        ARADHANACHA RAJA
                    </span>

                </button>


                <!-- BUTTON 2 -->

                <button
                    class="menu-btn"
                    onclick="openMedia('aagman')">

                    🪔 आगमन सोहळा

                    <span>
                        AAGMAN SOHALA
                    </span>

                </button>


                <!-- BUTTON 3 -->

                <button
                    class="menu-btn"
                    onclick="openMedia('visarjan')">

                    🌺 विसर्जन सोहळा

                    <span>
                        VISARJAN SOHALA
                    </span>

                </button>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                ॥ श्री आराधना गणेश मंडळ ॥

                <br>

                चौधरीवाडा, न्हावी

            </div>

        </div>

    </main>


    <!-- =====================================================
         GANPATI POPUP
    ====================================================== -->

    <div
        class="popup"
        id="ganpatiPopup">

        <div class="popup-card">

            <div class="sub-title">
                ॥ श्री गणेशाय नमः ॥
            </div>


            <!-- ROOT IMAGE PATH -->

            <img
                src="ganpati-bg.jpg"
                class="popup-ganpati"
                alt="Ganpati Bappa">


            <div class="popup-title">
                आराधनाचा राजा
            </div>


            <div class="popup-subtitle">
                गणपती बाप्पा मोरया 🙏
            </div>


            <div class="event-buttons">

                <button
                    class="event-btn"
                    onclick="openMedia('aagman')">

                    🪔 आगमन सोहळा

                    <small>
                        IMAGE + VIDEO
                    </small>

                </button>


                <button
                    class="event-btn"
                    onclick="openMedia('visarjan')">

                    🌺 विसर्जन सोहळा

                    <small>
                        IMAGE + VIDEO
                    </small>

                </button>

            </div>


            <button
                class="close-btn"
                onclick="closeGanpatiPopup()">

                ← मागे जा

            </button>

        </div>

    </div>


    <!-- =====================================================
         MEDIA POPUP
    ====================================================== -->

    <div
        class="media-popup"
        id="mediaPopup">

        <div class="media-card">

            <div
                class="media-title"
                id="mediaTitle">

                आगमन सोहळा

            </div>


            <!-- EVENT IMAGE -->

            <img
                id="eventImage"
                class="event-image"
                src=""
                alt="Event Image">


            <!-- EVENT VIDEO -->

            <video
                id="eventVideo"
                class="event-video"
                controls
                playsinline
                preload="metadata">

                <source
                    id="videoSource"
                    src=""
                    type="video/mp4">

                Your browser does not support video.

            </video>


            <div
                id="videoError"
                class="video-error">

                ⚠️ व्हिडिओ उपलब्ध नाही किंवा व्हिडिओ फाइल GitHub वर अपलोड केलेली नाही.

            </div>


            <!-- CLOSE -->

            <button
                class="close-btn"
                onclick="closeMedia()">

                ← मागे जा

            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           PARTICLES
        ====================================================== */

        const particles =
            document.getElementById("particles");


        for (
            let i = 0;
            i < 35;
            i++
        ) {

            const p =
                document.createElement("div");


            p.className =
                "particle";


            p.style.left =
                Math.random() * 100 + "%";


            p.style.animationDuration =
                (5 + Math.random() * 8) + "s";


            p.style.animationDelay =
                Math.random() * 8 + "s";


            const size =
                2 + Math.random() * 4;


            p.style.width =
                size + "px";


            p.style.height =
                size + "px";


            particles.appendChild(p);
        }


        /* =====================================================
           GANPATI POPUP
        ====================================================== */

        function openGanpatiPopup() {

            document
                .getElementById("ganpatiPopup")
                .classList.add("active");
        }


        function closeGanpatiPopup() {

            document
                .getElementById("ganpatiPopup")
                .classList.remove("active");
        }


        /* =====================================================
           MEDIA DATA
        ====================================================== */

        const mediaData = {

            aagman: {

                title:
                    "आगमन सोहळा - १२-०९-२०२६ 🥁 शिवराज्य बँड, चांदवड",

                image:
                    "aagman.jpg",

                video:
                    "aagman.mp4"
            },


            visarjan: {

                title:
                    "विसर्जन सोहळा - २०-०९-२०२६ 🎵 रॉकस्टार बँड ७८, चांदवड",

                image:
                    "visarjan.jpg",

                video:
                    "visarjan.mp4"
            }

        };


        /* =====================================================
           OPEN MEDIA
        ====================================================== */

        function openMedia(type) {

            const data =
                mediaData[type];


            if (!data) {
                return;
            }


            const popup =
                document.getElementById(
                    "mediaPopup"
                );


            const title =
                document.getElementById(
                    "mediaTitle"
                );


            const image =
                document.getElementById(
                    "eventImage"
                );


            const video =
                document.getElementById(
                    "eventVideo"
                );


            const source =
                document.getElementById(
                    "videoSource"
                );


            const videoError =
                document.getElementById(
                    "videoError"
                );


            /* TITLE */

            title.textContent =
                data.title;


            /* IMAGE */

            image.src =
                data.image;


            /* VIDEO */

            source.src =
                data.video;


            /* Hide previous error */

            videoError.style.display =
                "none";


            /* Reload video */

            video.load();


            /* Show popup */

            popup.classList.add(
                "active"
            );
        }


        /* =====================================================
           VIDEO ERROR
        ====================================================== */

        document
            .getElementById("eventVideo")
            .addEventListener(
                "error",
                function() {

                    document
                        .getElementById(
                            "videoError"
                        )
                        .style.display =
                        "block";
                }
            );


        /* =====================================================
           CLOSE MEDIA
        ====================================================== */

        function closeMedia() {

            const popup =
                document.getElementById(
                    "mediaPopup"
                );


            const video =
                document.getElementById(
                    "eventVideo"
                );


            video.pause();


            video.currentTime = 0;


            popup.classList.remove(
                "active"
            );
        }


        /* =====================================================
           ESC KEY
        ====================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeMedia();

                    closeGanpatiPopup();
                }

            }
        );

    </script>

</body>

</html>
